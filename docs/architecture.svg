<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="t d">
  <title id="t">Tally ARS architecture</title>
  <desc id="d">Host, attendee and display browsers sync through Firebase Realtime Database. The host's browser calls Groq directly for optional AI features. GitHub Pages serves the static files.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#6E7F99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">
    <g>
      <rect x="20" y="30" width="230" height="96" rx="12" fill="#14253F" stroke="#2A8DF3" stroke-width="2"/>
      <text x="135" y="68" font-size="20" font-weight="700" fill="#F3F6FB">Host dashboard</text>
      <text x="135" y="96" font-size="14" fill="#B8C4D9">builds the deck, runs the session</text>
    </g>
    <g>
      <rect x="20" y="170" width="230" height="96" rx="12" fill="#14253F" stroke="#C97D3C" stroke-width="2"/>
      <text x="135" y="208" font-size="20" font-weight="700" fill="#F3F6FB">Attendee phones</text>
      <text x="135" y="236" font-size="14" fill="#B8C4D9">scan the QR, vote in a browser</text>
    </g>
    <g>
      <rect x="20" y="310" width="230" height="96" rx="12" fill="#14253F" stroke="#6BA37E" stroke-width="2"/>
      <text x="135" y="348" font-size="20" font-weight="700" fill="#F3F6FB">Display screen</text>
      <text x="135" y="376" font-size="14" fill="#B8C4D9">projector view of the results</text>
    </g>
    <g>
      <rect x="370" y="120" width="230" height="180" rx="14" fill="#1F2A3D" stroke="#8B7BC7" stroke-width="2"/>
      <text x="485" y="166" font-size="20" font-weight="700" fill="#F3F6FB">Firebase</text>
      <text x="485" y="192" font-size="20" font-weight="700" fill="#F3F6FB">Realtime Database</text>
      <text x="485" y="228" font-size="14" fill="#B8C4D9">sessions/{code}</text>
      <text x="485" y="250" font-size="14" fill="#B8C4D9">results/{code}</text>
      <text x="485" y="278" font-size="14" fill="#B8C4D9">live sync, cleared when ended</text>
    </g>
    <g>
      <rect x="710" y="30" width="230" height="96" rx="12" fill="#14253F" stroke="#C97D3C" stroke-width="2"/>
      <text x="825" y="68" font-size="20" font-weight="700" fill="#F3F6FB">Groq API</text>
      <text x="825" y="96" font-size="14" fill="#B8C4D9">Speed Card, Improve Wording</text>
    </g>
    <g>
      <rect x="710" y="170" width="230" height="96" rx="12" fill="#1F2A3D" stroke="#6E7F99" stroke-width="2"/>
      <text x="825" y="208" font-size="18" font-weight="700" fill="#F3F6FB">Host's browser storage</text>
      <text x="825" y="236" font-size="14" fill="#B8C4D9">Groq key and model, draft deck</text>
    </g>
    <g>
      <rect x="20" y="420" width="920" height="26" rx="8" fill="#1F2A3D" stroke="#6E7F99" stroke-width="1.5"/>
      <text x="480" y="438" font-size="14" fill="#F3F6FB">GitHub Pages serves the static files: landing page, /app, service worker</text>
    </g>
    <text x="480" y="56" font-size="14" fill="#6E7F99" font-weight="600">your key, straight from the browser to Groq</text>
  </g>
  <g stroke="#6E7F99" stroke-width="2.5" fill="none" marker-start="url(#a)" marker-end="url(#a)">
    <line x1="254" y1="96" x2="366" y2="168"/>
    <line x1="254" y1="218" x2="366" y2="218"/>
    <line x1="254" y1="344" x2="366" y2="262"/>
  </g>
  <g stroke="#6E7F99" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <path d="M254 70 L706 70" stroke-dasharray="7 6"/>
  </g>
</svg>
